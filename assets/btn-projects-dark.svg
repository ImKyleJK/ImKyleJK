<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64" role="img" aria-label="Projects">
<title>Projects</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .on { fill: #fafafa; animation: light .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes light { from { fill: #18181b; } to { fill: #fafafa; } }
  .fade { animation: rise .7s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .blink { animation: blink 1.1s steps(1) infinite 1.6s; }
  @keyframes blink { 50% { fill: transparent; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="1" y="1" width="218" height="62" rx="12" fill="#09090b" stroke="#27272a" stroke-width="2"/>
<circle cx="31" cy="32" r="4.5" fill="#34d399"/>
<text class="mono" x="52.0" y="38.5" font-size="17" letter-spacing="2" fill="#fafafa">PROJECTS</text>
<text class="mono" x="198.0" y="38.5" text-anchor="end" font-size="17" letter-spacing="0" fill="#71717a">↗</text>
</svg>
