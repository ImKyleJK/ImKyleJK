<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .on { fill: #18181b; animation: light .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes light { from { fill: #ececef; } to { fill: #18181b; } }
