<svg xmlns="http://www.w3.org/2000/svg" width="178" height="40" viewBox="0 0 178 40" role="img" aria-label="MINECRAFT">
<title>MINECRAFT</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .on { fill: #18181b; animation: light .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes light { from { fill: #ececef; } to { fill: #18181b; } }
  .fade { animation: rise .7s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .blink { animation: blink 1.1s steps(1) infinite 1.6s; }
  @keyframes blink { 50% { fill: transparent; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="1" y="1" width="176" height="38" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="2"/>
<circle cx="21" cy="20" r="5" fill="#059669"/>
<text class="mono" x="36.0" y="26.5" font-size="18" letter-spacing="2" fill="#18181b">MINECRAFT</text>
</svg>
